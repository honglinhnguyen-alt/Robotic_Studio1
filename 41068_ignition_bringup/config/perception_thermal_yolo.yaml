/**/thermal_candidate_detector:
  ros__parameters:
    image_topic: thermal/image_raw
    normalized_topic: thermal/image_mono8
    detections_topic: perception/thermal/detections
    annotated_topic: perception/thermal/annotated_image
    candidate_active_topic: perception/thermal/candidate_active
    max_temperature_topic: perception/thermal/max_temperature

    # Gazebo Fortress L16 thermal images use 0.01 kelvin per count.
    kelvin_per_count: 0.01
    display_min_k: 285.0
    display_max_k: 335.0

    # R5: hot = hot_delta_k above the frame background (75th percentile) AND above the region's
    # local background (ring around its box). large_demo: ground ~293 K,
    # trees/rocks ~300.7 K, animals/campfires ~330 K. A 3-5 K threshold (C1)
    # would mark every tree (+7.7 K over the ground), so 10 K. Animals well
    # below the old fixed 315 K are still found.
    # hot_threshold_mode: absolute restores the fixed hot_threshold_k.
    hot_threshold_mode: relative
    hot_delta_k: 10.0
    local_background_margin: 0.3
    hot_threshold_k: 315.0
    min_hot_area_px: 30
    morphology_kernel_px: 3
    # R5: each hot region is tracked with a stable ID (heat_N) and must be
    # seen in this many consecutive frames before it is published.
    persistence_frames: 3
    tracking_iou_threshold: 0.20
    # Also match a region whose centre moved less than one box diagonal
    # (small, distant blobs lose IoU quickly).
    tracking_max_center_jump: 1.0
    # A published track survives this many missing frames with the same ID.
    tracking_max_missed_frames: 2
    max_regions: 8
    publish_annotated_image: true
    log_period_sec: 2.0

/**/animal_yolo_detector:
  ros__parameters:
    image_topic: camera/image
    confidence: 0.50
    iou: 0.70
    imgsz: 640
    device: ''
    publish_annotated_image: true

    # Thermal gating prevents continuous YOLO inference. The Trigger service
    # remains available for a fresh classification after navigation.
    continuous: false
    max_inference_hz: 3.0
    thermal_gate_enabled: true
    thermal_detections_topic: perception/thermal/detections
    thermal_retrigger_sec: 0.0
    # Each RGB frame (3 Hz) is paired with the thermal frame (10 Hz) closest
    # in time; pairs further apart than this are not used.
    max_rgb_thermal_age_sec: 0.15
    # Cancel a verification window after this many empty thermal frames.
    thermal_empty_reset_frames: 3
    thermal_buffer_sec: 2.0
    # Skip verification frames while the robot turns faster than this
    # [rad/s]: the two cameras would not show the same scene. 0 disables.
    max_verification_yaw_rate: 0.35
    odometry_topic: odometry
    # A hot region shorter than this in the RGB image is reported as
    # too_far (needs a closer look) instead of unknown_heat_source.
    min_classify_height_px: 18.0

    # Do not make a mission decision from one image. Each thermal candidate is
    # classified only when the same YOLO class wins at least 3 of 5 RGB frames.
    verification_frames: 5
    verification_min_votes: 3

    # Camera values match urdf_husky/husky.gazebo.xacro.
    thermal_image_width: 320
    thermal_image_height: 240
    thermal_hfov_deg: 60.0
    rgb_hfov_deg: 120.0
    thermal_roi_margin: 1.5
    thermal_rgb_offset_x_px: 0.0
    thermal_rgb_offset_y_px: 0.0
    # A YOLO box matches a hot region when the region centre lies inside the
    # box (+20 %), or when they overlap by this fraction of the smaller box.
    minimum_thermal_overlap: 0.5

    native_classes: [kangaroo, deer]
    exotic_classes: [boar]
    fused_detections_topic: perception/thermal_yolo/detections
    classification_topic: perception/thermal_yolo/result
    publish_legacy_result: true
    # Absolute name matches the current root-level mission_node subscriber.
    legacy_result_topic: /Yolo_result