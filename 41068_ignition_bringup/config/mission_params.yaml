# Mission layer parameters (mission_node.py + husky_node.py).
# Loaded by launch/41068_mission.launch.py. All topics are absolute.

/**/mission_node:
  ros__parameters:
    map_frame: husky1_map
    base_frame: husky1_base_link

    # Inputs
    registry_topic: /husky1/candidates/registry_json        # R2 candidate_registry
    test_candidate_topic: /husky1/mission/test_candidate    # manual Point for tests
    yolo_result_topic: /husky1/perception/thermal_yolo/result
    husky_status_topic: /husky1/mission/husky_status
    explore_status_topic: /husky1/explore/status
    # Outputs
    husky_command_topic: /husky1/mission/investigate
    explore_resume_topic: /husky1/explore/resume
    mission_status_topic: /husky1/mission/status

    confirm_confidence: 0.70          # R6: confirm a class only at >= 0.70
    max_attempts: 3                   # R4 / C1 3.3: 3 attempts, then UNRESOLVED
    # Every candidate ends CONFIRMED_EXOTIC / CONFIRMED_NATIVE or UNRESOLVED
    # with a reason (low_confidence > no_trained_animal_seen > too_far >
    # partial_view > not_visible > unreachable > system_error). YOLO only
    # knows three species, so "no animal box" never proves "not an animal".
    # Stop early (no_trained_animal_seen) after this many clear views without
    # a trained animal, taken from directions >= the separation apart:
    no_animal_views_to_stop: 2
    no_animal_view_separation_deg: 30.0
    # A re-detected UNRESOLVED candidate (any reason except
    # no_trained_animal_seen) is investigated again at most this often.
    max_reopen: 1
    # R1 thermal coverage sweep: when explore_lite has no frontier left, the
    # mission looks at mapped areas the 60 deg thermal camera never saw
    # (coverage_tracker grid) until thermal coverage >= target, no cluster
    # >= min area is left, max looks or the time budget is used; then the
    # Husky returns to its start.
    sweep_enabled: true
    sweep_target_coverage: 0.95
    sweep_min_area_m2: 3.0
    sweep_max_looks: 20
    sweep_timeout_sec: 360.0
    sweep_look_timeout_sec: 120.0
    sweep_dwell_sec: 3.0
    sweep_retry_radius: 2.0
    # A new registry record this close to an investigated candidate is
    # treated as the same animal (DUPLICATE) and is not visited again.
    # Seen from another side the same animal was localized up to ~1.1 m
    # from its first record (new thermal track, so the registry's 1.0 m merge
    # and a shared-track rule both missed it and it was counted twice).
    # large_demo keeps every pair of heat sources >= 6 m apart, so 2.5 m
    # cannot merge two different animals. Must be > registry merge distance
    # (1.0 m) to have any effect. 0 disables.
    duplicate_radius: 2.5
    # true: only merge when both records came from the same thermal track
    # (for worlds where different animals stand closer than duplicate_radius).
    duplicate_requires_shared_track: false
    # explore_lite cancels every Nav2 goal when paused; wait before the Husky
    # node sends its goal so that cancel cannot hit it.
    pause_settle_sec: 1.5
    # per attempt, until YOLO verification starts. Keep it longer than
    # husky max_goal_tries x nav_timeout_sec (3 x 90 s) + turning + settling.
    husky_timeout_sec: 330.0
    verify_timeout_sec: 25.0          # YOLO consensus must arrive within this
    # Which thermal region is "this candidate": bearing error tolerance
    bearing_tolerance_deg: 15.0
    thermal_image_width: 320          # must match the thermal camera
    thermal_hfov_deg: 60.0
    resume_exploration_on_start: true
    status_period_sec: 0.5

/**/husky_node:
  ros__parameters:
    map_frame: husky1_map
    base_frame: husky1_base_link
    command_topic: /husky1/mission/investigate
    status_topic: /husky1/mission/husky_status
    map_topic: /husky1/map
    navigate_action: /husky1/navigate_to_pose
    spin_action: /husky1/spin
    verify_service: /husky1/perception/verify_now

    # C1 3.3: observation pose 2-4 m from the candidate.
    # Keep the decimal point in these lists (ROS declares them as doubles).
    # Attempt k uses element k-1: distance and rotation of the view around
    # the candidate (0 = the robot's side). Each retry looks from another
    # angle and a little closer, but never closer than
    # safety_radius + goal_tolerance (2.5 m) to any heat source: with the
    # bumper 0.5 m ahead of the centre that leaves >= ~1 m to the animal.
    standoff_distances: [3.5, 3.0, 2.5]
    safety_radius: 2.0                # m, robot centre to heat source
    look_standoff: 4.0                # m, thermal sweep viewpoint distance
    goal_tolerance: 0.5               # = Nav2 xy_goal_tolerance
    attempt_angle_offsets_deg: [0.0, 50.0, -50.0]
    # Directions tried around that view until a free pose is found
    search_offsets_deg: [0.0, 25.0, -25.0, 50.0, -50.0, 80.0, -80.0, 120.0, -120.0, 180.0]
    clearance_radius: 0.6             # m of free SLAM-map cells around a pose
    max_goal_tries: 3                 # R4: at most 3 Nav2 goals per attempt
    nav_timeout_sec: 90.0
    # Attempt 1 only: already within this distance -> just turn and look
    look_from_current_within: 4.0
    min_view_distance: 1.5
    face_tolerance_deg: 10.0
    spin_time_allowance_sec: 15.0
    settle_sec: 1.5                   # stand still before asking YOLO
    verify_retries: 4                 # thermal needs 3 frames after turning
    verify_retry_sec: 1.0

/**/coverage_tracker:
  ros__parameters:
    map_topic: /husky1/map
    map_frame: husky1_map
    camera_frame: husky1_thermal_camera_link
    coverage_topic: /husky1/mission/coverage
    grid_topic: /husky1/mission/thermal_coverage_grid
    publish_grid: true
    # Must match the thermal camera; depth (localisation) is clipped at 10 m.
    thermal_hfov_deg: 60.0
    thermal_range_m: 10.0
    # R1 survey boundary: circle in the map frame (= world frame, the Husky
    # starts at the origin). large_demo is ringed by cliffs ~35-38 m out.
    boundary_center_x: 0.0
    boundary_center_y: 0.0
    boundary_radius: 30.0
    cell_size: 0.2
    update_period_sec: 0.5
    publish_period_sec: 1.0
